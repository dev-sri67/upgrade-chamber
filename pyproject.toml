[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-chamber"
version = "0.1.0"
description = "Bounded dependency upgrade evaluation on Vultr"
requires-python = ">=3.11,<3.12"
dependencies = [
    "docker==7.2.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
upgrade-chamber-inference = "upgrade_chamber.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
